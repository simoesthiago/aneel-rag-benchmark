# =============================================================================
# ingest_corpus.yml — Pipeline mensal de ingestão do corpus ANEEL
# =============================================================================
#
# Secrets necessários:
#   HF_TOKEN          — escrita no HuggingFace Hub (obrigatório)
#   ANEEL_PROXY_URL   — Worker Cloudflare para cedoc/ (obrigatório em Actions)
#
# Por quê o Worker? IPs de datacenter (Azure/GitHub) recebem HTTP 403 do
# Cloudflare no cedoc/, igual ao Colab. curl_cffi sozinho não basta nesses IPs.
# Em rede residencial/local o proxy é opcional.
# =============================================================================

name: Ingest ANEEL corpus → HuggingFace Hub

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      wave:
        description: "Wave a executar (1, 2 ou 3)"
        type: choice
        options: ["1", "2", "3"]
        default: "1"
        required: true

jobs:
  ingest:
    name: Ingest corpus (Wave ${{ inputs.wave || '1' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ingest.txt

      - name: Install ingestion dependencies
        run: pip install -r requirements-ingest.txt

      - name: Preflight — cedoc/ via proxy
        env:
          ANEEL_PROXY_URL: ${{ secrets.ANEEL_PROXY_URL }}
        run: |
          if [ -z "$ANEEL_PROXY_URL" ]; then
            echo "::error::Secret ANEEL_PROXY_URL não configurado."
            echo "Deploy workers/aneel-proxy e adicione a URL em Settings → Secrets."
            exit 1
          fi
          python -c "
          from src.ingestion.scraper_atos import baixar_ato
          pdf = baixar_ato('ren', 2021, 1000)
          if not pdf:
              raise SystemExit('Preflight falhou: REN 1000/2021 não baixou via proxy')
          print(f'Preflight OK: REN 1000/2021 — {len(pdf)} bytes')
          "

      - name: Run ingestion pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ANEEL_PROXY_URL: ${{ secrets.ANEEL_PROXY_URL }}
          WAVE: ${{ inputs.wave || '1' }}
        run: python -m src.ingestion.run_wave --wave "$WAVE"
