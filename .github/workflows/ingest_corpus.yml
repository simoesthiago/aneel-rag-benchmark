# =============================================================================
# ingest_corpus.yml — Pipeline mensal de ingestão do corpus ANEEL
# =============================================================================
#
# Secrets:
#   HF_TOKEN          — escrita no HuggingFace Hub (obrigatório)
#   ANEEL_PROXY_URL        — Worker CF para cedoc/ (obrigatório em Actions)
#                            Ver workers/aneel-proxy/README.md
#                            ⚠️  Service Placement deve estar ativo (www2.aneel.gov.br:443)
#   ANEEL_GITLAB_PROXY_URL — Worker CF para GitLab da ANEEL (obrigatório em Actions)
#                            Ver workers/aneel-gitlab-proxy/README.md
#                            ⚠️  Service Placement deve estar ativo (git.aneel.gov.br:443)
#
# Se o preflight falhar: verifique Service Placement nos dois Workers.
# =============================================================================

name: Ingest ANEEL corpus → HuggingFace Hub

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      wave:
        description: "Wave a executar (1, 2 ou 3)"
        type: choice
        options: ["1", "2", "3"]
        default: "1"
        required: true
      skip_preflight:
        description: "Pular teste do cedoc/ (não recomendado)"
        type: boolean
        default: false

jobs:
  ingest:
    name: Ingest corpus (Wave ${{ inputs.wave || '1' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ingest.txt

      - name: Install ingestion dependencies
        run: pip install -r requirements-ingest.txt

      - name: Validate Proxy health
        if: ${{ inputs.skip_preflight != true }}
        env:
          ANEEL_PROXY_URL: ${{ secrets.ANEEL_PROXY_URL }}
        run: |
          if [ -z "$ANEEL_PROXY_URL" ]; then
            echo "::error::Secret ANEEL_PROXY_URL não configurado."
            exit 1
          fi
          health=$(curl -sf "${ANEEL_PROXY_URL%/}/health" || true)
          if [ "$health" != "aneel-proxy ok" ]; then
            echo "::warning::GET /health não retornou 'aneel-proxy ok' (got: $health)"
            echo "Verifique o Worker: Workers & Pages → aneel-proxy → Edit code → Deploy"
          else
            echo "Proxy health OK"
          fi

      - name: Preflight — cedoc/ via proxy (com retries)
        if: ${{ inputs.skip_preflight != true }}
        env:
          ANEEL_PROXY_URL: ${{ secrets.ANEEL_PROXY_URL }}
        run: |
          for attempt in $(seq 1 12); do
            echo "=== Preflight tentativa $attempt/12 ==="
            if python -c "
          from src.ingestion.scraper_atos import baixar_ato
          pdf = baixar_ato('ren', 2021, 1000)
          if not pdf:
              raise SystemExit(1)
          print(f'Preflight OK: REN 1000/2021 — {len(pdf)} bytes')
          "; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Preflight falhou após 12 tentativas."
          echo "1) Verifique Service Placement: Workers & Pages → aneel-proxy → Settings → Placement → Service (www2.aneel.gov.br:443)"
          echo "2) Redeploye o Worker: cole workers/aneel-proxy/worker.js no dashboard e clique Deploy"
          echo "3) Ou reexecute com skip_preflight=true (só leis/PRODIST se GitLab responder)"
          exit 1

      - name: Run ingestion pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ANEEL_PROXY_URL: ${{ secrets.ANEEL_PROXY_URL }}
          ANEEL_GITLAB_PROXY_URL: ${{ secrets.ANEEL_GITLAB_PROXY_URL }}
          WAVE: ${{ inputs.wave || '1' }}
        run: python -m src.ingestion.run_wave --wave "$WAVE"
