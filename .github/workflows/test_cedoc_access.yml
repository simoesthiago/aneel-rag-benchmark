# =============================================================================
# test_cedoc_access.yml — Verifica se o GitHub Actions consegue baixar do cedoc/
# =============================================================================
#
# Por que este workflow existe?
# -----------------------------
# O cedoc/ da ANEEL usa Cloudflare Bot Management. Confirmamos que:
#   - Localmente (IP residencial): curl_cffi com impersonate=chrome120 → 200 OK
#   - Google Colab (IP do GCP): mesmo código → 403
#
# A pergunta: GitHub Actions (Azure-hosted runners) também é bloqueado?
# Se sim → precisamos de Cloudflare Workers ou ScrapingBee como proxy
# Se não → toda a Camada 1 pode rodar em Actions, agendada via cron
#
# Como rodar:
#   1. Vá em Actions → "Test cedoc/ access from GitHub runners"
#   2. Clique em "Run workflow"
#   3. Veja o resultado nos logs
#
# Resultado esperado se PASSAR:
#   ✅ curl_cffi (chrome120): HTTP 200 — XYZ bytes
#
# Resultado esperado se FALHAR:
#   ❌ curl_cffi (chrome120): HTTP 403 — Cloudflare block
# =============================================================================

name: Test cedoc/ access from GitHub runners

on:
  workflow_dispatch:  # disparo manual via UI
  # NOTA: não rodamos em push porque é só diagnóstico, não CI

jobs:
  probe:
    name: Probe cedoc/ from GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install curl_cffi
        run: |
          pip install curl_cffi requests --quiet
          echo "✅ Dependências instaladas"

      - name: Detect runner IP
        run: |
          echo "=== Diagnóstico do runner ==="
          echo "IP público: $(curl -s https://api.ipify.org)"
          echo "Hostname: $(hostname)"
          echo ""

      - name: Test 1 — curl simples (baseline)
        continue-on-error: true
        run: |
          echo "=== Teste 1: curl simples ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -A "Mozilla/5.0 (X11; Linux x86_64)" \
            https://www2.aneel.gov.br/cedoc/ren20211000.pdf)
          echo "HTTP Status: $STATUS"

      - name: Test 2 — Python requests (igual ao que falhou no Colab)
        continue-on-error: true
        run: |
          python << 'EOF'
          import requests
          print("=== Teste 2: requests do Python ===")
          try:
              resp = requests.get(
                  "https://www2.aneel.gov.br/cedoc/ren20211000.pdf",
                  headers={"User-Agent": "Mozilla/5.0"},
                  timeout=30,
              )
              print(f"HTTP Status: {resp.status_code}")
              print(f"Content size: {len(resp.content)} bytes")
              print(f"Server header: {resp.headers.get('server')}")
              print(f"CF-Ray: {resp.headers.get('cf-ray')}")
          except Exception as e:
              print(f"❌ Erro: {e}")
          EOF

      - name: Test 3 — curl_cffi chrome120 (a solução proposta)
        continue-on-error: true
        run: |
          python << 'EOF'
          from curl_cffi import requests as cffi_requests
          print("=== Teste 3: curl_cffi chrome120 ===")
          try:
              resp = cffi_requests.get(
                  "https://www2.aneel.gov.br/cedoc/ren20211000.pdf",
                  impersonate="chrome120",
                  timeout=30,
              )
              print(f"HTTP Status: {resp.status_code}")
              print(f"Content size: {len(resp.content)} bytes")
              if resp.status_code == 200 and resp.content[:4] == b"%PDF":
                  print("✅ SUCESSO — PDF válido baixado!")
                  print("→ GitHub Actions É VIÁVEL para o scraper.")
              else:
                  print("❌ FALHOU — resposta não é PDF válido.")
                  print("→ Precisamos de Plano B (Cloudflare Workers ou ScrapingBee).")
          except Exception as e:
              print(f"❌ Erro: {e}")
          EOF

      - name: Test 4 — variações de impersonation
        continue-on-error: true
        run: |
          python << 'EOF'
          from curl_cffi import requests as cffi_requests
          print("=== Teste 4: outras impersonations ===")
          for imp in ["chrome131", "chrome124", "safari18_0", "safari17_2_ios"]:
              try:
                  resp = cffi_requests.get(
                      "https://www2.aneel.gov.br/cedoc/ren20211000.pdf",
                      impersonate=imp,
                      timeout=15,
                  )
                  marker = "✅" if resp.status_code == 200 else "❌"
                  print(f"  {marker} {imp}: HTTP {resp.status_code} ({len(resp.content)} bytes)")
              except Exception as e:
                  print(f"  ❌ {imp}: ERROR {e}")
          EOF

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "=========================================================="
          echo " VEREDITO"
          echo "=========================================================="
          echo " Se o Teste 3 mostrou HTTP 200 → GitHub Actions é viável"
          echo " Se o Teste 3 mostrou HTTP 403 → precisa de proxy"
          echo "=========================================================="
